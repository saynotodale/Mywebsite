<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dale A. Tompkins | Author</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, "Times New Roman", serif;
            background: #111111;
            color: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 60px 20px;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #999999;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 86px);
            font-weight: normal;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #777777;
            margin: 30px auto;
        }

        .coming-soon {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: normal;
            margin-bottom: 20px;
        }

        .description {
            max-width: 600px;
            margin: 0 auto;
            color: #b5b5b5;
            font-size: 17px;
            line-height: 1.7;
        }

        .footer {
            margin-top: 70px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666666;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 15px;
            }

            h1 {
                letter-spacing: -1px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="eyebrow">Author</div>

        <h1>Dale A. Tompkins</h1>

        <div class="divider"></div>

        <h2 class="coming-soon">Coming Soon</h2>

        <p class="description">
            A new home for stories, books, and everything in between.
            The website is currently under construction.
        </p>

        <div class="footer">
            © 2026 Dale A. Tompkins
        </div>

    </main>

</body>
</html>
